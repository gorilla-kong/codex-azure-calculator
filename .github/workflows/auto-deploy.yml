name: Test and deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install API dependencies
        working-directory: backend
        run: npm ci

      - name: Test API
        working-directory: backend
        run: npm test

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CODEXCALCULATOR_AZURE_CREDENTIALS }}

      - name: Build and deploy container
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ca624031e1beacr.azurecr.io
          registryUsername: ${{ secrets.CODEXCALCULATOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CODEXCALCULATOR_REGISTRY_PASSWORD }}
          containerAppName: codex-calculator
          resourceGroup: codex-demo-rg
          imageToBuild: ca624031e1beacr.azurecr.io/codex-calculator:${{ github.sha }}
